name: PORTFOLIO OPTION SCANNER V2

on:

  # 수동 실행
  workflow_dispatch:

  # 한국시간 오전 6:00
  # UTC 전날 21:00
  schedule:
    - cron: "0 21 * * *"


jobs:

  portfolio-scanner:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # 3. DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            requests \
            yfinance \
            numpy


      # ======================================================
      # 4. CHECK FILES
      # ======================================================

      - name: Check repository files
        run: |

          echo "=========================================="
          echo "PORTFOLIO OPTION SCANNER V2"
          echo "=========================================="

          echo ""

          pwd

          echo ""

          ls -lah

          echo ""

          echo "PYTHON FILES"

          find . \
            -type f \
            -name "*.py" \
            -print

          echo ""

          echo "WORKFLOW FILES"

          find . \
            -type f \
            \( \
              -name "*.yml" \
              -o \
              -name "*.yaml" \
            \) \
            -print


      # ======================================================
      # 5. CHECK SELECTED SYMBOLS
      # ======================================================

      - name: Show selected symbols

        run: |

          python - <<'PY'

          from selected_symbols import SELECTED_SYMBOLS

          print("")
          print("==========================================")
          print("📊 SELECTED SYMBOLS")
          print("==========================================")
          print("")

          print(
              f"총 종목 수: "
              f"{len(SELECTED_SYMBOLS)}"
          )

          print("")

          for i, ticker in enumerate(
              SELECTED_SYMBOLS,
              1
          ):

              print(
                  f"{i:02d}. {ticker}"
              )

          print("")

          PY


      # ======================================================
      # 6. RUN PORTFOLIO SCANNER
      # ======================================================

      - name: Run Portfolio Option Scanner

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PYTHONIOENCODING: utf-8

        run: |

          echo "=========================================="

          echo "🔥 PORTFOLIO OPTION SCANNER START"

          echo "=========================================="

          echo ""

          python batch_option_search.py

          echo ""

          echo "=========================================="

          echo "🔥 PORTFOLIO OPTION SCANNER FINISHED"

          echo "=========================================="


      # ======================================================
      # 7. FIND OPTION SEARCH CSV
      # ======================================================

      - name: Find OPTION SEARCH CSV

        run: |

          echo "=========================================="

          echo "🔎 OPTION SEARCH CSV"

          echo "=========================================="

          echo ""

          find . \
            -type f \
            -name "*_OPTION_SEARCH.csv" \
            -print

          echo ""

          COUNT=$(
            find . \
              -type f \
              -name "*_OPTION_SEARCH.csv" \
              | wc -l
          )

          echo "OPTION SEARCH CSV COUNT: $COUNT"

          echo ""

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ OPTION SEARCH CSV NOT FOUND"

            exit 1

          fi

          echo ""

          echo "✅ OPTION SEARCH CSV FOUND"


      # ======================================================
      # 8. FIND FINAL CSV
      # ======================================================

      - name: Find final ranking CSV

        run: |

          echo "=========================================="

          echo "🔎 FINAL RANKING CSV"

          echo "=========================================="

          echo ""

          find . \
            -type f \
            -name "OPTION_FINAL_RANKING.csv" \
            -print

          echo ""

          if [ ! -f "03_RESULTS/daily/OPTION_FINAL_RANKING.csv" ]; then

            echo "❌ FINAL RANKING CSV NOT FOUND"

            exit 1

          fi

          echo ""

          echo "=========================================="

          echo "📊 FINAL RANKING"

          echo "=========================================="

          echo ""

          cat \
            "03_RESULTS/daily/OPTION_FINAL_RANKING.csv"


      # ======================================================
      # 9. UPLOAD RESULTS
      # ======================================================

      - name: Upload scanner results

        uses: actions/upload-artifact@v4

        with:

          name: portfolio-option-results

          path: |

            03_RESULTS/daily/*.csv

          if-no-files-found: error


      # ======================================================
      # 10. DONE
      # ======================================================

      - name: Scanner completed

        run: |

          echo ""

          echo "=========================================="

          echo "✅ PORTFOLIO OPTION SCANNER V2 COMPLETE"

          echo "=========================================="
