name: OPTION FLOW SCANNER V1

on:
  workflow_dispatch:

jobs:
  run-v1:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. GitHub 저장소 가져오기
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python 설치
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. Python 패키지 설치
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance numpy

      # ======================================================
      # 4. 저장소 구조 확인
      # ======================================================

      - name: Check repository files
        run: |
          echo "=========================================="
          echo "REPOSITORY FILES"
          echo "=========================================="

          pwd

          echo ""
          echo "ROOT:"
          ls -lah

          echo ""
          echo "ALL PYTHON FILES:"
          find . -maxdepth 4 -type f -name "*.py" -print

          echo ""
          echo "ALL CSV FILES BEFORE SCAN:"
          find . -type f -name "*.csv" -print

      # ======================================================
      # 5. OPTION FLOW SCANNER V1 실행
      # ======================================================

      - name: Run OPTION FLOW SCANNER V1
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "=========================================="
          echo "START OPTION FLOW SCANNER V1"
          echo "=========================================="

          python batch_option_search.py

          echo ""
          echo "=========================================="
          echo "OPTION FLOW SCANNER V1 FINISHED"
          echo "=========================================="

      # ======================================================
      # 6. 결과 CSV 전체 검색
      # ======================================================

      - name: Find result CSV
        run: |
          echo "=========================================="
          echo "SEARCHING RESULT CSV"
          echo "=========================================="

          echo ""
          echo "ALL CSV FILES:"
          find . -type f -name "*.csv" -print

          echo ""
          echo "OPTION_FINAL_RANKING.csv SEARCH:"
          find . -type f -name "OPTION_FINAL_RANKING.csv" -print

          if find . -type f -name "OPTION_FINAL_RANKING.csv" | grep -q .; then
            echo ""
            echo "✅ OPTION_FINAL_RANKING.csv FOUND"
          else
            echo ""
            echo "❌ OPTION_FINAL_RANKING.csv NOT FOUND"
            exit 1
          fi

      # ======================================================
      # 7. 결과 CSV 내용 확인
      # ======================================================

      - name: Show result CSV
        run: |
          echo "=========================================="
          echo "RESULT CSV CONTENT"
          echo "=========================================="

          RESULT_FILE=$(find . -type f -name "OPTION_FINAL_RANKING.csv" | head -1)

          echo "RESULT FILE:"
          echo "$RESULT_FILE"

          echo ""
          echo "FILE INFO:"
          ls -lh "$RESULT_FILE"

          echo ""
          echo "CSV CONTENT:"
          head -20 "$RESULT_FILE"

      # ======================================================
      # 8. TELEGRAM V1 결과 전송
      # ======================================================

      - name: Send V1 result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          echo "=========================================="
          echo "TELEGRAM V1 RESULT SENDER"
          echo "=========================================="

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN이 GitHub Secrets에 없습니다."
            exit 1
          fi

          echo "✅ TELEGRAM_BOT_TOKEN 확인"

          echo ""
          echo "RESULT CSV:"
          find . -type f -name "OPTION_FINAL_RANKING.csv" -print

          python telegram_sender_v1.py

          echo ""
          echo "=========================================="
          echo "TELEGRAM V1 SEND FINISHED"
          echo "=========================================="

      # ======================================================
      # 9. 최종 완료
      # ======================================================

      - name: Final status
        run: |
          echo ""
          echo "=================================================="
          echo "🔥 OPTION FLOW SCANNER V1 COMPLETE"
          echo "=================================================="

          echo ""
          echo "Generated CSV:"
          find . -type f -name "OPTION_FINAL_RANKING.csv" -print

          echo ""
          echo "Python files:"
          find . -maxdepth 4 -type f -name "*.py" -print

          echo ""
          echo "=================================================="
