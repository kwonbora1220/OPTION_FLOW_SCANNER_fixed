name: OPTION FLOW SCANNER V1

on:
  workflow_dispatch:

jobs:
  run-v1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance numpy

      - name: Check files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== PYTHON FILES ==="
          find . -maxdepth 2 -name "*.py" -print

      - name: Run OPTION FLOW SCANNER V1
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd .
          python batch_option_search.py
