name: OPTION FLOW SCANNER V1

on:
  workflow_dispatch:

jobs:
  run-v1:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 3. DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance numpy


      # ======================================================
      # 4. CHECK FILES
      # ======================================================

      - name: Check repository files
        run: |

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          pwd

          echo ""

          ls -lah

          echo ""

          echo "PYTHON FILES"

          find . \
            -type f \
            -name "*.py" \
            -print

          echo ""

          echo "WORKFLOW FILES"

          find . \
            -type f \
            \( \
              -name "*.yml" \
              -o \
              -name "*.yaml" \
            \) \
            -print


      # ======================================================
      # 5. CHECK SELECTED SYMBOLS
      # ======================================================

      - name: Check selected symbols
        run: |

          echo "=========================================="
          echo "📊 SELECTED SYMBOLS"
          echo "=========================================="

          python - <<'PY'

          from selected_symbols import SELECTED_SYMBOLS

          print(
              f"총 종목 수: {len(SELECTED_SYMBOLS)}"
          )

          for i, ticker in enumerate(
              SELECTED_SYMBOLS,
              1
          ):

              print(
                  f"{i:02d}. {ticker}"
              )

          PY


      # ======================================================
      # 6. OPTION SEARCH + FINAL BATCH
      #
      # option_search.py
      #     ↓
      # 개별 상세 분석
      #     ↓
      # 개별 CSV
      #     ↓
      # 개별 Telegram
      #
      # 모든 종목 처리 후
      #
      # batch_option_search.py
      #     ↓
      # Final Score
      #     ↓
      # Final Ranking
      #     ↓
      # Final Telegram
      #
      # ======================================================

      - name: Run OPTION FLOW SCANNER
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8

        run: |

          echo ""
          echo "=========================================="
          echo "🔥 OPTION FLOW SCANNER START"
          echo "=========================================="

          python batch_option_search.py

          echo ""
          echo "=========================================="
          echo "🔥 OPTION FLOW SCANNER FINISHED"
          echo "=========================================="


      # ======================================================
      # 7. CHECK OPTION SEARCH CSV
      # ======================================================

      - name: Check OPTION SEARCH CSV
        run: |

          echo ""
          echo "=========================================="
          echo "🔎 OPTION SEARCH CSV"
          echo "=========================================="

          COUNT=$(find . \
            -type f \
            -name "*_OPTION_SEARCH.csv" \
            | wc -l)

          echo ""
          echo "OPTION SEARCH CSV COUNT: $COUNT"

          echo ""

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ OPTION SEARCH CSV 없음"

            find . \
              -type f \
              -name "*.csv" \
              -print

            exit 1

          fi

          echo "✅ OPTION SEARCH CSV 확인"


      # ======================================================
      # 8. CHECK FINAL CSV
      # ======================================================

      - name: Check FINAL CSV
        run: |

          echo ""
          echo "=========================================="
          echo "📊 FINAL RESULT"
          echo "=========================================="

          RESULT="03_RESULTS/daily/OPTION_FINAL_RANKING.csv"

          if [ ! -f "$RESULT" ]; then

            echo "❌ FINAL CSV 없음"

            echo ""
            echo "현재 CSV 목록:"

            find . \
              -type f \
              -name "*.csv" \
              -print

            exit 1

          fi

          echo "✅ FINAL CSV 확인"

          echo ""

          ls -lh "$RESULT"

          echo ""

          cat "$RESULT"


      # ======================================================
      # 9. FINAL STATUS
      # ======================================================

      - name: Final status
        if: always()
        run: |

          echo ""
          echo "=========================================="
          echo "🔥 OPTION FLOW SCANNER V1"
          echo "=========================================="

          echo ""
          echo "✅ Repository checkout"
          echo "✅ Python 3.12"
          echo "✅ Dependencies"
          echo "✅ Selected symbols"
          echo "✅ OPTION SEARCH"
          echo "✅ Individual CSV"
          echo "✅ Individual Telegram"
          echo "✅ FINAL SCORE"
          echo "✅ FINAL RANKING"
          echo "✅ FINAL Telegram"

          echo ""
          echo "🔥 ALL PROCESS FINISHED"

          echo ""
          echo "=========================================="
