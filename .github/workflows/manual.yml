
name: OPTION FLOW SCANNER V1

on:
  workflow_dispatch:

jobs:
  run-v1:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. 저장소 가져오기
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python 설치
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. 필요한 패키지 설치
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance numpy

      # ======================================================
      # 4. 저장소 파일 확인
      # ======================================================

      - name: Check repository files
        run: |
          echo "=========================================="
          echo "REPOSITORY FILES"
          echo "=========================================="

          pwd

          echo ""
          echo "ROOT FILES:"
          ls -lah

          echo ""
          echo "PYTHON FILES:"
          find . -maxdepth 3 -type f -name "*.py" -print

          echo ""
          echo "OPTION SEARCH FILE:"
          if [ -f "option_search.py" ]; then
            echo "✅ option_search.py FOUND"
          else
            echo "❌ option_search.py NOT FOUND"
            exit 1
          fi

          echo ""
          echo "BATCH SEARCH FILE:"
          if [ -f "batch_option_search.py" ]; then
            echo "✅ batch_option_search.py FOUND"
          else
            echo "❌ batch_option_search.py NOT FOUND"
            exit 1
          fi

          echo ""
          echo "SYMBOL FILE:"
          if [ -f "selected_symbols.py" ]; then
            echo "✅ selected_symbols.py FOUND"
          else
            echo "❌ selected_symbols.py NOT FOUND"
            exit 1
          fi

          echo ""
          echo "TELEGRAM FILE:"
          if [ -f "telegram_sender_v1.py" ]; then
            echo "✅ telegram_sender_v1.py FOUND"
          else
            echo "❌ telegram_sender_v1.py NOT FOUND"
            exit 1
          fi

      # ======================================================
      # 5. OPTION FLOW SCANNER 실행
      # ======================================================

      - name: Run OPTION FLOW SCANNER V1
        env:
          PYTHONIOENCODING: utf-8
        run: |
          echo "=========================================="
          echo "🔥 START OPTION FLOW SCANNER V1"
          echo "=========================================="

          python batch_option_search.py

          echo ""
          echo "=========================================="
          echo "🔥 OPTION FLOW SCANNER V1 FINISHED"
          echo "=========================================="

      # ======================================================
      # 6. 결과 CSV 찾기
      # ======================================================

      - name: Find result CSV
        run: |
          echo "=========================================="
          echo "🔎 SEARCHING RESULT CSV"
          echo "=========================================="

          find . \
            -type f \
            -name "OPTION_FINAL_RANKING.csv" \
            -print

          echo ""

          if [ -f "03_RESULTS/daily/OPTION_FINAL_RANKING.csv" ]; then
            echo "✅ RESULT CSV FOUND"
            ls -lh "03_RESULTS/daily/OPTION_FINAL_RANKING.csv"
          else
            echo "❌ RESULT CSV NOT FOUND"

            echo ""
            echo "ALL CSV FILES:"
            find . -type f -name "*.csv" -print

            exit 1
          fi

      # ======================================================
      # 7. 결과 CSV 내용 확인
      # ======================================================

      - name: Show result CSV
        run: |
          echo "=========================================="
          echo "📊 RESULT CSV"
          echo "=========================================="

          cat "03_RESULTS/daily/OPTION_FINAL_RANKING.csv"

      # ======================================================
      # 8. Telegram 전송
      # ======================================================

      - name: Send V1 result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "7729872113"
          PYTHONIOENCODING: utf-8
        run: |
          echo "=========================================="
          echo "📱 TELEGRAM V1 RESULT SENDER"
          echo "=========================================="

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN이 없습니다."
            exit 1
          fi

          echo "✅ TELEGRAM_BOT_TOKEN 확인"
          echo "✅ TELEGRAM_CHAT_ID 확인"

          python telegram_sender_v1.py

      # ======================================================
      # 9. 최종 상태
      # ======================================================

      - name: Final status
        run: |
          echo ""
          echo "=========================================="
          echo "🔥 OPTION FLOW SCANNER V1 COMPLETE"
          echo "=========================================="
          echo "✅ 옵션 데이터 수집"
          echo "✅ 옵션 분석"
          echo "✅ 점수 계산"
          echo "✅ CSV 생성"
          echo "✅ Telegram 전송"
          echo "=========================================="

