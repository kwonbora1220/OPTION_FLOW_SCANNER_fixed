name: OPTION FLOW SCANNER V1

on:
  workflow_dispatch:

jobs:
  run-v1:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 3. DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance numpy


      # ======================================================
      # 4. CHECK FILES
      # ======================================================

      - name: Check repository
        run: |

          echo "=========================================="
          echo "📂 REPOSITORY"
          echo "=========================================="

          pwd

          echo ""
          echo "PYTHON FILES"
          find . -type f -name "*.py" -print

          echo ""
          echo "WORKFLOW FILES"
          find . -type f \( -name "*.yml" -o -name "*.yaml" \) -print

          echo ""
          echo "=========================================="


      # ======================================================
      # 5. RUN COMPLETE SCANNER
      #
      # batch_option_search.py가
      #
      # OPTION SEARCH
      #      ↓
      # 개별 CSV
      #      ↓
      # 개별 Telegram
      #      ↓
      # FINAL SCORE
      #      ↓
      # FINAL CSV
      #      ↓
      # FINAL Telegram
      #
      # 전부 담당한다.
      # ======================================================

      - name: Run OPTION FLOW SCANNER V1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8

        run: |

          echo "=========================================="
          echo "🔥 OPTION FLOW SCANNER V1 START"
          echo "=========================================="

          echo ""

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN 없음"
            exit 1
          fi

          echo "✅ TELEGRAM_BOT_TOKEN 확인"

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ TELEGRAM_CHAT_ID 없음"
            exit 1
          fi

          echo "✅ TELEGRAM_CHAT_ID 확인"

          echo ""

          python batch_option_search.py


      # ======================================================
      # 6. CHECK FINAL RESULT
      # ======================================================

      - name: Check final result
        if: always()
        run: |

          echo "=========================================="
          echo "📊 FINAL RESULT CHECK"
          echo "=========================================="

          echo ""

          find . \
            -type f \
            -name "*_OPTION_SEARCH.csv" \
            -print

          echo ""

          if [ -f "03_RESULTS/daily/OPTION_FINAL_RANKING.csv" ]; then

            echo "✅ OPTION_FINAL_RANKING.csv FOUND"

            echo ""

            ls -lh \
              "03_RESULTS/daily/OPTION_FINAL_RANKING.csv"

            echo ""

            cat \
              "03_RESULTS/daily/OPTION_FINAL_RANKING.csv"

          else

            echo "❌ OPTION_FINAL_RANKING.csv NOT FOUND"

          fi


      # ======================================================
      # 7. FINAL STATUS
      # ======================================================

      - name: Final status
        if: always()
        run: |

          echo ""
          echo "=========================================="
          echo "🔥 OPTION FLOW SCANNER V1 COMPLETE"
          echo "=========================================="

          python --version

          echo ""

          echo "OPTION SEARCH"
          echo "      ↓"
          echo "INDIVIDUAL CSV"
          echo "      ↓"
          echo "INDIVIDUAL TELEGRAM"
          echo "      ↓"
          echo "FINAL SCORE"
          echo "      ↓"
          echo "FINAL CSV"
          echo "      ↓"
          echo "FINAL TELEGRAM"

          echo ""

          echo "=========================================="
