# ============================================================
# DISPLAY HELPERS
# ============================================================

def fmt_money(value):

    try:
        value = float(value)
    except Exception:
        return "N/A"

    if not np.isfinite(value):
        return "N/A"

    sign = "-" if value < 0 else ""

    value = abs(value)

    if value >= 1_000_000_000:

        return (
            f"{sign}"
            f"${value / 1_000_000_000:.2f}B"
        )

    if value >= 1_000_000:

        return (
            f"{sign}"
            f"${value / 1_000_000:.2f}M"
        )

    if value >= 1_000:

        return (
            f"{sign}"
            f"${value / 1_000:.1f}K"
        )

    return (
        f"{sign}"
        f"${value:,.0f}"
    )


def fmt_iv(value):

    try:
        value = float(value)
    except Exception:
        return "N/A"

    if not np.isfinite(value):
        return "N/A"

    if value < 2:
        value *= 100

    return f"{value:.1f}%"


def safe_float(value):

    try:

        value = float(value)

        if np.isfinite(value):
            return value

    except Exception:
        pass

    return np.nan


# ============================================================
# CURRENT PRICE
# ============================================================

def get_current_price(ticker):

    print()
    print("GET CURRENT PRICE")

    # --------------------------------------------------------
    # 1. 1-minute
    # --------------------------------------------------------

    try:

        history = ticker.history(
            period="1d",
            interval="1m",
            prepost=True
        )

        if history is not None and not history.empty:

            close = (
                history["Close"]
                .dropna()
            )

            if not close.empty:

                price = float(
                    close.iloc[-1]
                )

                if np.isfinite(price):

                    print(
                        f"CURRENT PRICE : {price:.2f}"
                    )

                    return price

    except Exception as exc:

        print(
            f"1m price failed: {exc}"
        )

    # --------------------------------------------------------
    # 2. 5-day
    # --------------------------------------------------------

    try:

        history = ticker.history(
            period="5d"
        )

        if history is not None and not history.empty:

            close = (
                history["Close"]
                .dropna()
            )

            if not close.empty:

                price = float(
                    close.iloc[-1]
                )

                if np.isfinite(price):

                    print(
                        f"CURRENT PRICE : {price:.2f}"
                    )

                    return price

    except Exception as exc:

        print(
            f"5d price failed: {exc}"
        )

    # --------------------------------------------------------
    # 3. Fast info
    # --------------------------------------------------------

    try:

        fast_info = ticker.fast_info

        for key in [
            "last_price",
            "regular_market_price"
        ]:

            try:

                value = fast_info.get(
                    key
                )

            except Exception:
                value = None

            if value is not None:

                value = safe_float(
                    value
                )

                if np.isfinite(value):

                    print(
                        f"CURRENT PRICE : {value:.2f}"
                    )

                    return value

    except Exception as exc:

        print(
            f"fast_info failed: {exc}"
        )

    raise RuntimeError(
        "Unable to determine current price."
    )


# ============================================================
# DTE CALCULATION
#
# expiration 문자열을 직접 날짜로 변환한다.
# Timestamp.utcnow() 사용 안 함.
# ============================================================

def calculate_dte(expiration):

    try:

        today = pd.Timestamp.now(
            tz="UTC"
        ).date()

        expiry_date = pd.Timestamp(
            expiration
        ).date()

        return (
            expiry_date
            - today
        ).days

    except Exception as exc:

        print(
            f"DTE calculation failed "
            f"for {expiration}: {exc}"
        )

        return None


# ============================================================
# GEX PROXY
#
# CALL = +
# PUT  = -
#
# 실제 Dealer GEX가 아님.
# OI 기반 구조 분석용 Proxy.
# ============================================================

def calculate_gex(
    gamma,
    open_interest,
    spot,
    option_type
):

    gamma = safe_float(
        gamma
    )

    open_interest = safe_float(
        open_interest
    )

    spot = safe_float(
        spot
    )

    if not all(
        np.isfinite(x)
        for x in [
            gamma,
            open_interest,
            spot
        ]
    ):

        return np.nan

    if (
        gamma <= 0
        or open_interest <= 0
        or spot <= 0
    ):

        return 0.0

    gex = (
        gamma
        * open_interest
        * 100
        * spot
        * spot
        * 0.01
    )

    if option_type == "PUT":

        gex
