# ============================================================
# RKLB OPTION STRUCTURE SCANNER
#
# Yahoo Finance FREE OPTIONS DATA
#
# 목적:
#   1. RKLB 전체 옵션 만기 수집
#   2. 0~180 DTE
#   3. $80~$100 Strike 구조 분석
#   4. CALL / PUT Volume
#   5. CALL / PUT OI
#   6. Premium Proxy
#   7. GEX Proxy
#   8. Call Wall / Put Wall
#   9. Telegram Report
#
# 주의:
#   Premium / GEX / Flow는 무료 데이터 기반 Proxy
#   실제 Buy/Sell 및 Dealer Position은 확인할 수 없음
# ============================================================

import os
import time
from datetime import datetime, timezone

import numpy as np
import pandas as pd
import yfinance as yf


# ============================================================
# CONFIG
# ============================================================

SYMBOL = os.getenv(
    "SYMBOL",
    "RKLB"
).upper()

MIN_STRIKE = float(
    os.getenv(
        "MIN_STRIKE",
        "80"
    )
)

MAX_STRIKE = float(
    os.getenv(
        "MAX_STRIKE",
        "100"
    )
)

MAX_DTE = int(
    os.getenv(
        "MAX_DTE",
        "180"
    )
)

OUTPUT_DIR = "rklb_option_structure"

os.makedirs(
    OUTPUT_DIR,
    exist_ok=True
)


# ============================================================
# DISPLAY HELPERS
# ============================================================

def fmt_money(value):

    try:
        value = float(value)
    except Exception:
        return "N/A"

    if not np.isfinite(value):
        return "N/A"

    sign = "-" if value < 0 else ""

    value = abs(value)

    if value >= 1_000_000_000:

        return (
            f"{sign}"
            f"${value / 1_000_000_000:.2f}B"
        )

    if value >= 1_000_000:

        return (
            f"{sign}"
            f"${value / 1_000_000:.2f}M"
        )

    if value >= 1_000:

        return (
            f"{sign}"
            f"${value / 1_000:.1f}K"
        )

    return (
        f"{sign}"
        f"${value:,.0f}"
    )


def fmt_iv(value):

    try:
        value = float(value)
    except Exception:
        return "N/A"

    if not np.isfinite(value):
        return "N/A"

    if value < 2:
        value *= 100

    return f"{value:.1f}%"


def safe_float(value):

    try:

        value = float(value)

        if np.isfinite(value):
            return value

    except Exception:
        pass

    return np.nan


# ============================================================
# CURRENT PRICE
# ============================================================

def get_current_price(ticker):

    print()
    print("GET CURRENT PRICE")

    # --------------------------------------------------------
    # 1. 1-minute
    # --------------------------------------------------------

    try:

        history = ticker.history(
            period="1d",
            interval="1m",
            prepost=True
        )

        if history is not None and not history.empty:

            close = (
                history["Close"]
                .dropna()
            )

            if not close.empty:

                price = float(
                    close.iloc[-1]
                )

                if np.isfinite(price):

                    print(
                        f"CURRENT PRICE : {price:.2f}"
                    )

                    return price

    except Exception as exc:

        print(
            f"1m price failed: {exc}"
        )

    # --------------------------------------------------------
    # 2. 5-day
    # --------------------------------------------------------

    try:

        history = ticker.history(
            period="5d"
        )

        if history is not None and not history.empty:

            close = (
                history["Close"]
                .dropna()
            )

            if not close.empty:

                price = float(
                    close.iloc[-1]
                )

                if np.isfinite(price):

                    print(
                        f"CURRENT PRICE : {price:.2f}"
                    )

                    return price

    except Exception as exc:

        print(
            f"5d price failed: {exc}"
        )

    # --------------------------------------------------------
    # 3. Fast info
    # --------------------------------------------------------

    try:

        fast_info = ticker.fast_info

        for key in [
            "last_price",
            "regular_market_price"
        ]:

            try:

                value = fast_info.get(
                    key
                )

            except Exception:
                value = None

            if value is not None:

                value = safe_float(
                    value
                )

                if np.isfinite(value):

                    print(
                        f"CURRENT PRICE : {value:.2f}"
                    )

                    return value

    except Exception as exc:

        print(
            f"fast_info failed: {exc}"
        )

    raise RuntimeError(
        "Unable to determine current price."
    )


# ============================================================
# DTE CALCULATION
#
# expiration 문자열을 직접 날짜로 변환한다.
# Timestamp.utcnow() 사용 안 함.
# ============================================================

def calculate_dte(expiration):

    try:

        today = pd.Timestamp.now(
            tz="UTC"
        ).date()

        expiry_date = pd.Timestamp(
            expiration
        ).date()

        return (
            expiry_date
            - today
        ).days

    except Exception as exc:

        print(
            f"DTE calculation failed "
            f"for {expiration}: {exc}"
        )

        return None


# ============================================================
# GEX PROXY
#
# CALL = +
# PUT  = -
#
# 실제 Dealer GEX가 아님.
# OI 기반 구조 분석용 Proxy.
# ============================================================

def calculate_gex(
    gamma,
    open_interest,
    spot,
    option_type
):

    gamma = safe_float(
        gamma
    )

    open_interest = safe_float(
        open_interest
    )

    spot = safe_float(
        spot
    )

    if not all(
        np.isfinite(x)
        for x in [
            gamma,
            open_interest,
            spot
        ]
    ):

        return np.nan

    if (
        gamma <= 0
        or open_interest <= 0
        or spot <= 0
    ):

        return 0.0

    gex = (
        gamma
        * open_interest
        * 100
        * spot
        * spot
        * 0.01
    )

    if option_type == "PUT":

        gex *= -1

    return gex


# ============================================================
# PREMIUM PROXY
# ============================================================

def calculate_premium(
    volume,
    bid,
    ask,
    last_price
):

    volume = safe_float(
        volume
    )

    bid = safe_float(
        bid
    )

    ask = safe_float(
        ask
    )

    last_price = safe_float(
        last_price
    )

    if (
        not np.isfinite(volume)
        or volume <= 0
    ):

        return 0.0

    # --------------------------------------------------------
    # Mid price
    # --------------------------------------------------------

    if (
        np.isfinite(bid)
        and np.isfinite(ask)
        and ask >= bid
        and ask > 0
    ):

        mid = (
            bid + ask
        ) / 2

    elif (
        np.isfinite(last_price)
        and last_price > 0
    ):

        mid = last_price

    else:

        return 0.0

    return (
        volume
        * mid
        * 100
    )


# ============================================================
# FETCH YAHOO OPTION DATA
#
# 중요:
#   여기서는 strike 필터를 걸지 않는다.
#
#   먼저 전체 option chain을 수집하고
#   그 다음 $80~$100을 필터링한다.
# ============================================================

def fetch_options():

    print()
    print(
        "=" * 72
    )

    print(
        "FETCH YAHOO FINANCE OPTION DATA"
    )

    print(
        "=" * 72
    )

    ticker = yf.Ticker(
        SYMBOL
    )

    # --------------------------------------------------------
    # Current price
    # --------------------------------------------------------

    spot = get_current_price(
        ticker
    )

    # --------------------------------------------------------
    # Expirations
    # --------------------------------------------------------

    try:

        expirations = list(
            ticker.options
        )

    except Exception as exc:

        raise RuntimeError(
            f"Unable to get Yahoo expirations: {exc}"
        )

    print(
        f"TOTAL EXPIRATIONS : "
        f"{len(expirations)}"
    )

    if not expirations:

        raise RuntimeError(
            "Yahoo returned no option expirations."
        )

    all_rows = []

    successful_expirations = 0

    failed_expirations = 0

    # --------------------------------------------------------
    # Every expiration
    # --------------------------------------------------------

    for index, expiration in enumerate(
        expirations,
        start=1
    ):

        dte = calculate_dte(
            expiration
        )

        if dte is None:

            failed_expirations += 1

            continue

        # ----------------------------------------------------
        # DTE filter
        #
        # Yahoo expiration 전체를 확인하되
        # 0~MAX_DTE만 실제 수집
        # ----------------------------------------------------

        if dte < 0:

            print(
                f"[{index}/{len(expirations)}] "
                f"{expiration} "
                f"DTE={dte} SKIP"
            )

            continue

        if dte > MAX_DTE:

            print(
                f"[{index}/{len(expirations)}] "
                f"{expiration} "
                f"DTE={dte} SKIP"
            )

            continue

        print()
        print(
            f"[{index}/{len(expirations)}] "
            f"FETCH {expiration} "
            f"| DTE {dte}"
        )

        # ----------------------------------------------------
        # Retry
        # ----------------------------------------------------

        chain = None

        last_error = None

        for attempt in range(
            1,
            4
        ):

            try:

                chain = ticker.option_chain(
                    expiration
                )

                break

            except Exception as exc:

                last_error = exc

                print(
                    f"  attempt "
                    f"{attempt}/3 failed: "
                    f"{exc}"
                )

                time.sleep(
                    1.5 * attempt
                )

        # ----------------------------------------------------
        # Chain failed
        # ----------------------------------------------------

        if chain is None:

            failed_expirations += 1

            print(
                f"  FAILED: "
                f"{expiration}"
            )

            print(
                f"  ERROR: "
                f"{last_error}"
            )

            continue

        expiration_rows = 0

        # ----------------------------------------------------
        # CALL
        # ----------------------------------------------------

        try:

            calls = chain.calls.copy()

        except Exception:

            calls = pd.DataFrame()

        if (
            calls is not None
            and not calls.empty
        ):

            calls["option_type"] = "CALL"

            calls["expiration"] = (
                expiration
            )

            calls["DTE"] = int(
                dte
            )

            all_rows.append(
                calls
            )

            expiration_rows += len(
                calls
            )

        # ----------------------------------------------------
        # PUT
        # ----------------------------------------------------

        try:

            puts = chain.puts.copy()

        except Exception:

            puts = pd.DataFrame()

        if (
            puts is not None
            and not puts.empty
        ):

            puts["option_type"] = "PUT"

            puts["expiration"] = (
                expiration
            )

            puts["DTE"] = int(
                dte
            )

            all_rows.append(
                puts
            )

            expiration_rows += len(
                puts
            )

        # ----------------------------------------------------
        # Status
        # ----------------------------------------------------

        if expiration_rows > 0:

            successful_expirations += 1

            print(
                f"  CALL rows: "
                f"{len(calls):,}"
            )

            print(
                f"  PUT rows : "
                f"{len(puts):,}"
            )

            print(
                f"  TOTAL    : "
                f"{expiration_rows:,}"
            )

        else:

            failed_expirations += 1

            print(
                "  WARNING: "
                "No CALL/PUT rows"
            )

        # ----------------------------------------------------
        # Avoid Yahoo rate pressure
        # ----------------------------------------------------

        time.sleep(
            0.4
        )

    # ========================================================
    # RESULT
    # ========================================================

    print()
    print(
        "=" * 72
    )

    print(
        "YAHOO COLLECTION RESULT"
    )

    print(
        "=" * 72
    )

    print(
        f"Successful expirations : "
        f"{successful_expirations}"
    )

    print(
        f"Failed expirations     : "
        f"{failed_expirations}"
    )

    print(
        f"Raw frames             : "
        f"{len(all_rows)}"
    )

    # --------------------------------------------------------
    # Critical validation
    # --------------------------------------------------------

    if not all_rows:

        raise RuntimeError(
            "No option rows were collected. "
            "Yahoo returned expiration dates but "
            "no CALL/PUT option chain rows."
        )

    raw = pd.concat(
        all_rows,
        ignore_index=True
    )

    print(
        f"RAW OPTION ROWS       : "
        f"{len(raw):,}"
    )

    return raw, spot


# ============================================================
# NORMALIZE
# ============================================================

def normalize(
    data,
    spot
):

    print()
    print(
        "=" * 72
    )

    print(
        "NORMALIZE OPTION DATA"
    )

    print(
        "=" * 72
    )

    data = data.copy()

    numeric_columns = [
        "strike",
        "volume",
        "openInterest",
        "bid",
        "ask",
        "lastPrice",
        "impliedVolatility",
        "gamma",
        "delta",
        "vega",
        "DTE"
    ]

    for column in numeric_columns:

        if column in data.columns:

            data[column] = pd.to_numeric(
                data[column],
                errors="coerce"
            )

    required_columns = [
        "strike",
        "volume",
        "openInterest",
        "bid",
        "ask",
        "lastPrice",
        "impliedVolatility",
        "gamma",
        "option_type",
        "expiration",
        "DTE"
    ]

    missing = [
        column
        for column in required_columns
        if column not in data.columns
    ]

    if missing:

        raise RuntimeError(
            "Missing required columns: "
            + ", ".join(missing)
        )

    # --------------------------------------------------------
    # Basic cleanup
    # --------------------------------------------------------

    data = data[
        data["strike"].notna()
    ].copy()

    data = data[
        data["option_type"].isin(
            [
                "CALL",
                "PUT"
            ]
        )
    ].copy()

    # ========================================================
    # STRIKE FILTER
    #
    # IMPORTANT:
    # 여기서 처음으로 $80~$100 필터 적용
    # ========================================================

    before_strike = len(
        data
    )

    data = data[
        (
            data["strike"]
            >= MIN_STRIKE
        )
        &
        (
            data["strike"]
            <= MAX_STRIKE
        )
    ].copy()

    print(
        f"Rows before strike filter : "
        f"{before_strike:,}"
    )

    print(
        f"Rows after strike filter  : "
        f"{len(data):,}"
    )

    # --------------------------------------------------------
    # DTE filter
    # --------------------------------------------------------

    data = data[
        (
            data["DTE"]
            >= 0
        )
        &
        (
            data["DTE"]
            <= MAX_DTE
        )
    ].copy()

    if data.empty:

        raise RuntimeError(
            "Option data exists but "
            "nothing remains after "
            f"strike filter ${MIN_STRIKE:g}"
            f"~${MAX_STRIKE:g} and "
            f"DTE 0~{MAX_DTE}."
        )

    # --------------------------------------------------------
    # GEX
    # --------------------------------------------------------

    print(
        "Calculating GEX..."
    )

    data["gex"] = data.apply(
        lambda row:
        calculate_gex(
            row["gamma"],
            row["openInterest"],
            spot,
            row["option_type"]
        ),
        axis=1
    )

    # --------------------------------------------------------
    # Premium
    # --------------------------------------------------------

    print(
        "Calculating Premium Proxy..."
    )

    data["premium_proxy"] = data.apply(
        lambda row:
        calculate_premium(
            row["volume"],
            row["bid"],
            row["ask"],
            row["lastPrice"]
        ),
        axis=1
    )

    # --------------------------------------------------------
    # Volume / OI
    # --------------------------------------------------------

    data["volume_oi"] = np.where(
        data["openInterest"] > 0,

        data["volume"]
        /
        data["openInterest"],

        np.nan
    )

    # --------------------------------------------------------
    # Distance from spot
    # --------------------------------------------------------

    data["distance_pct"] = (
        (
            data["strike"]
            -
            spot
        )
        /
        spot
        *
        100
    )

    # --------------------------------------------------------
    # ATM distance
    # --------------------------------------------------------

    data["atm_distance"] = (
        data["strike"]
        -
        spot
    ).abs()

    return data


# ============================================================
# STRIKE AGGREGATION
# ============================================================

def build_strike_table(
    data
):

    rows = []

    strikes = sorted(
        data["strike"]
        .dropna()
        .unique()
    )

    for strike in strikes:

        frame = data[
            data["strike"]
            == strike
        ]

        calls = frame[
            frame["option_type"]
            == "CALL"
        ]

        puts = frame[
            frame["option_type"]
            == "PUT"
        ]

        call_volume = (
            calls["volume"]
            .fillna(0)
            .sum()
        )

        put_volume = (
            puts["volume"]
            .fillna(0)
            .sum()
        )

        call_oi = (
            calls["openInterest"]
            .fillna(0)
            .sum()
        )

        put_oi = (
            puts["openInterest"]
            .fillna(0)
            .sum()
        )

        call_gex = (
            calls["gex"]
            .fillna(0)
            .sum()
        )

        put_gex = (
            puts["gex"]
            .fillna(0)
            .sum()
        )

        call_premium = (
            calls["premium_proxy"]
            .fillna(0)
            .sum()
        )

        put_premium = (
            puts["premium_proxy"]
            .fillna(0)
            .sum()
        )

        rows.append(
            {
                "strike":
                    strike,

                "call_volume":
                    call_volume,

                "put_volume":
                    put_volume,

                "total_volume":
                    call_volume
                    +
                    put_volume,

                "call_oi":
                    call_oi,

                "put_oi":
                    put_oi,

                "total_oi":
                    call_oi
                    +
                    put_oi,

                "call_gex":
                    call_gex,

                "put_gex":
                    put_gex,

                "net_gex":
                    call_gex
                    +
                    put_gex,

                "call_premium":
                    call_premium,

                "put_premium":
                    put_premium,

                "total_premium":
                    call_premium
                    +
                    put_premium
            }
        )

    return pd.DataFrame(
        rows
    )


# ============================================================
# TOP CONTRACTS
# ============================================================

def build_top_contracts(
    data
):

    result = data.copy()

    result["importance"] = (

        np.log1p(
            result[
                "premium_proxy"
            ]
            .clip(
                lower=0
            )
        )

        +

        np.log1p(
            result[
                "volume"
            ]
            .clip(
                lower=0
            )
        )

        +

        np.log1p(
            result[
                "openInterest"
            ]
            .clip(
                lower=0
            )
        )

        +

        np.log1p(
            result[
                "gex"
            ]
            .abs()
            .clip(
                lower=0
            )
        )
    )

    return (
        result
        .sort_values(
            "importance",
            ascending=False
        )
        .head(50)
    )


# ============================================================
# WALL DETECTION
# ============================================================

def find_wall(
    strike_table,
    spot,
    option_type
):

    if option_type == "CALL":

        candidates = strike_table[
            strike_table["strike"]
            >= spot
        ].copy()

        if candidates.empty:
            return None

        candidates["oi"] = (
            candidates["call_oi"]
        )

        candidates["gex_abs"] = (
            candidates["call_gex"]
            .abs()
        )

        candidates["volume"] = (
            candidates["call_volume"]
        )

    else:

        candidates = strike_table[
            strike_table["strike"]
            <= spot
        ].copy()

        if candidates.empty:
            return None

        candidates["oi"] = (
            candidates["put_oi"]
        )

        candidates["gex_abs"] = (
            candidates["put_gex"]
            .abs()
        )

        candidates["volume"] = (
            candidates["put_volume"]
        )

    # --------------------------------------------------------
    # 20% range
    # --------------------------------------------------------

    candidates["distance"] = (
        (
            candidates["strike"]
            -
            spot
        ).abs()
        /
        spot
    )

    candidates = candidates[
        candidates["distance"]
        <= 0.20
    ].copy()

    if candidates.empty:

        return None

    candidates["score"] = (

        np.log1p(
            candidates["oi"]
            .clip(
                lower=0
            )
        )

        +

        np.log1p(
            candidates["gex_abs"]
            .clip(
                lower=0
            )
        )

        +

        0.25
        *
        np.log1p(
            candidates["volume"]
            .clip(
                lower=0
            )
        )

        +

        3
        /
        (
            1
            +
            candidates["distance"]
            * 20
        )
    )

    return (
        candidates
        .sort_values(
            "score",
            ascending=False
        )
        .iloc[0]
    )


# ============================================================
# DTE DISTRIBUTION
# ============================================================

def build_dte_distribution(
    data
):

    bins = [
        -1,
        7,
        30,
        60,
        180
    ]

    labels = [
        "0~7 DTE",
        "8~30 DTE",
        "31~60 DTE",
        "61~180 DTE"
    ]

    temp = data.copy()

    temp["dte_bucket"] = pd.cut(
        temp["DTE"],
        bins=bins,
        labels=labels
    )

    distribution = (
        temp["dte_bucket"]
        .value_counts(
            sort=False
        )
    )

    return distribution


# ============================================================
# MAIN
# ============================================================

def main():

    started = datetime.now(
        timezone.utc
    )

    print()
    print(
        "=" * 72
    )

    print(
        "🔥 RKLB OPTION STRUCTURE SCANNER"
    )

    print(
        "=" * 72
    )

    print(
        f"SYMBOL       : {SYMBOL}"
    )

    print(
        f"STRIKE RANGE : "
        f"${MIN_STRIKE:g}"
        f" ~ "
        f"${MAX_STRIKE:g}"
    )

    print(
        f"DTE RANGE    : "
        f"0 ~ {MAX_DTE}"
    )

    print(
        "=" * 72
    )

    # ========================================================
    # FETCH
    # ========================================================

    raw, spot = fetch_options()

    print()
    print(
        f"RAW ROWS : {len(raw):,}"
    )

    # ========================================================
    # NORMALIZE
    # ========================================================

    data = normalize(
        raw,
        spot
    )

    print()
    print(
        f"FINAL OPTION ROWS : "
        f"{len(data):,}"
    )

    if data.empty:

        raise RuntimeError(
            "No options remain after filtering."
        )

    # ========================================================
    # STRIKE TABLE
    # ========================================================

    strike_table = (
        build_strike_table(
            data
        )
    )

    # ========================================================
    # TOP CONTRACTS
    # ========================================================

    top_contracts = (
        build_top_contracts(
            data
        )
    )

    # ========================================================
    # WALL
    # ========================================================

    call_wall = find_wall(
        strike_table,
        spot,
        "CALL"
    )

    put_wall = find_wall(
        strike_table,
        spot,
        "PUT"
    )

    # ========================================================
    # CALL / PUT
    # ========================================================

    calls = data[
        data["option_type"]
        == "CALL"
    ]

    puts = data[
        data["option_type"]
        == "PUT"
    ]

    call_volume = (
        calls["volume"]
        .fillna(0)
        .sum()
    )

    put_volume = (
        puts["volume"]
        .fillna(0)
        .sum()
    )

    call_oi = (
        calls["openInterest"]
        .fillna(0)
        .sum()
    )

    put_oi = (
        puts["openInterest"]
        .fillna(0)
        .sum()
    )

    call_gex = (
        calls["gex"]
        .fillna(0)
        .sum()
    )

    put_gex = (
        puts["gex"]
        .fillna(0)
        .sum()
    )

    net_gex = (
        call_gex
        +
        put_gex
    )

    call_premium = (
        calls["premium_proxy"]
        .fillna(0)
        .sum()
    )

    put_premium = (
        puts["premium_proxy"]
        .fillna(0)
        .sum()
    )

    total_volume = (
        call_volume
        +
        put_volume
    )

    total_oi = (
        call_oi
        +
        put_oi
    )

    total_premium = (
        call_premium
        +
        put_premium
    )

    call_volume_ratio = (

        call_volume
        /
        total_volume
        *
        100

        if total_volume > 0

        else np.nan
    )

    call_oi_ratio = (

        call_oi
        /
        total_oi
        *
        100

        if total_oi > 0

        else np.nan
    )

    call_premium_ratio = (

        call_premium
        /
        total_premium
        *
        100

        if total_premium > 0

        else np.nan
    )

    # ========================================================
    # ATM IV
    # ========================================================

    atm_rows = (
        data
        .sort_values(
            "atm_distance"
        )
        .head(10)
    )

    atm_iv = (
        atm_rows[
            "impliedVolatility"
        ]
        .dropna()
        .mean()
    )

    # ========================================================
    # DTE DISTRIBUTION
    # ========================================================

    dte_distribution = (
        build_dte_distribution(
            data
        )
    )

    # ========================================================
    # SAVE RAW FILTERED DATA
    # ========================================================

    data.to_csv(
        os.path.join(
            OUTPUT_DIR,
            "contracts.csv"
        ),
        index=False
    )

    strike_table.to_csv(
        os.path.join(
            OUTPUT_DIR,
            "strike_structure.csv"
        ),
        index=False
    )

    top_contracts.to_csv(
        os.path.join(
            OUTPUT_DIR,
            "top_contracts.csv"
        ),
        index=False
    )

    # ========================================================
    # SUMMARY CSV
    # ========================================================

    summary = pd.DataFrame(
        [
            {
                "symbol":
                    SYMBOL,

                "spot":
                    spot,

                "min_strike":
                    MIN_STRIKE,

                "max_strike":
                    MAX_STRIKE,

                "max_dte":
                    MAX_DTE,

                "rows":
                    len(data),

                "call_volume":
                    call_volume,

                "put_volume":
                    put_volume,

                "call_volume_ratio":
                    call_volume_ratio,

                "call_oi":
                    call_oi,

                "put_oi":
                    put_oi,

                "call_oi_ratio":
                    call_oi_ratio,

                "call_gex":
                    call_gex,

                "put_gex":
                    put_gex,

                "net_gex":
                    net_gex,

                "call_premium":
                    call_premium,

                "put_premium":
                    put_premium,

                "call_premium_ratio":
                    call_premium_ratio,

                "call_wall":
                    (
                        call_wall["strike"]
                        if call_wall is not None
                        else np.nan
                    ),

                "put_wall":
                    (
                        put_wall["strike"]
                        if put_wall is not None
                        else np.nan
                    ),

                "atm_iv":
                    atm_iv
            }
        ]
    )

    summary.to_csv(
        os.path.join(
            OUTPUT_DIR,
            "summary.csv"
        ),
        index=False
    )

