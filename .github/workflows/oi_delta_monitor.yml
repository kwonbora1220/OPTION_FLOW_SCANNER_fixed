name: OI DELTA MONITOR

on:

  workflow_dispatch:

  schedule:

    # US market close 이후
    # UTC 21:15 = KST 다음날 06:15
    - cron: "15 21 * * 1-5"


permissions:

  contents: write


jobs:

  oi-delta:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          token: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            yfinance


      # ======================================================
      # OI DELTA
      # ======================================================

      - name: Run OI Delta Monitor

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python oi_delta_monitor.py


      # ======================================================
      # SHOW SNAPSHOTS
      # ======================================================

      - name: Verify OI snapshots

        run: |

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "💾 OI SNAPSHOT FILES"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          find \
            03_RESULTS/daily/oi_history \
            -maxdepth 1 \
            -type f \
            -name "*.csv" \
            -print \
            | sort


      # ======================================================
      # SAVE TO GITHUB
      # ======================================================

      - name: Persist OI snapshots

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add -f \
            03_RESULTS/daily/oi_history


          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "📦 GIT STATUS"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          git status --short


          if git diff --cached --quiet; then

            echo "ℹ️ OI snapshot 변경사항 없음"

          else

            git commit \
              -m "data: save OI snapshots"

            git push

          fi
