name: PORTFOLIO OPTION SCANNER V2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - am
          - option
          - pm
          - full

  # GitHub cron은 UTC 기준
  # EDT / EST 모두 등록하고 실제 단계는 schedule 값으로 판별
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "0 13 * * 1-5"

    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"

    - cron: "0 20 * * 1-5"
    - cron: "0 21 * * 1-5"

    - cron: "5 20 * * 1-5"
    - cron: "5 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: portfolio-option-scanner-v2-main
  cancel-in-progress: false

jobs:

  portfolio-scanner-v2:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          ref: main


      # ========================================================
      # 2. PYTHON
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ========================================================
      # 3. DEPENDENCIES
      # ========================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            yfinance


      # ========================================================
      # 4. ENVIRONMENT
      # ========================================================

      - name: Configure Python path

        run: |

          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"


      # ========================================================
      # 5. DETERMINE RUN MODE
      #
      # schedule 값을 기준으로 AM / OPTION / PM을 구분
      #
      # GitHub Actions가 몇 분 늦게 시작되어도
      # 단계가 뒤바뀌지 않음
      # ========================================================

      - name: Determine execution mode

        id: mode

        env:

          MANUAL_MODE: ${{ github.event.inputs.mode }}

          SCHEDULE_CRON: ${{ github.event.schedule }}

        run: |

          python - <<'PY'

          import os

          from datetime import datetime

          from zoneinfo import ZoneInfo


          manual = os.environ.get(
              "MANUAL_MODE",
              ""
          )


          schedule = os.environ.get(
              "SCHEDULE_CRON",
              ""
          )


          # ====================================================
          # MANUAL
          # ====================================================

          if manual and manual != "auto":

              mode = manual


          else:

              # =================================================
              # AUTOMATIC SCHEDULE
              # =================================================

              schedule_map = {

                  # 08:00 ET
                  "0 12 * * 1-5": "am",
                  "0 13 * * 1-5": "am",

                  # 08:30 ET
                  "30 12 * * 1-5": "option",
                  "30 13 * * 1-5": "option",

                  # 16:00 ET
                  "0 20 * * 1-5": "option",
                  "0 21 * * 1-5": "option",

                  # 16:05 ET
                  "5 20 * * 1-5": "pm",
                  "5 21 * * 1-5": "pm",
              }


              mode = schedule_map.get(
                  schedule,
                  "none"
              )


          now = datetime.now(
              ZoneInfo(
                  "America/New_York"
              )
          )


          print(
              "=========================================="
          )

          print(
              "🇺🇸 US EASTERN TIME"
          )

          print(
              now.strftime(
                  "%Y-%m-%d %H:%M:%S %Z"
              )
          )

          print(
              "=========================================="
          )

          print(
              f"Schedule: {schedule or 'manual'}"
          )

          print(
              f"RUN_MODE: {mode}"
          )


          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:

              f.write(
                  f"mode={mode}\n"
              )

              f.write(
                  "market_date="
                  f"{now.strftime('%Y%m%d')}\n"
              )

          PY


      # ========================================================
      # 6. COMPILE CHECK
      # ========================================================

      - name: Compile Python files

        run: |

          set -e

          python -m py_compile \
            01_MARKET_CONTEXT/am_market_context.py \
            01_MARKET_CONTEXT/pm_volatility_update.py \
            option_search.py \
            batch_option_search.py \
            oi_history.py \
            signal_history.py \
            signal_performance.py \
            portfolio_option_scanner_v2.py

          echo "✅ Python compile check passed"


      # ========================================================
      # 7. AM MARKET CONTEXT
      #
      # 🇺🇸 08:00 ET
      # ========================================================

      - name: 🌅 AM Market Context

        if: |
          steps.mode.outputs.mode == 'am' ||
          steps.mode.outputs.mode == 'full'

        env:

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID:
            ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          set -e

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🌅 AM MARKET CONTEXT"

          echo "🇺🇸 08:00 ET"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          python \
            01_MARKET_CONTEXT/am_market_context.py


          echo ""

          echo "📂 AM RESULT"


          find \
            03_RESULTS/daily \
            -maxdepth 1 \
            -type f \
            -name "AM_MARKET_CONTEXT_*" \
            -print


      # ========================================================
      # 8. SAVE AM CONTEXT
      #
      # 중요:
      #
      # 08:00 AM 실행과
      # 08:30 OPTION 실행은
      # 서로 다른 GitHub Actions 실행이다.
      #
      # 따라서 AM JSON을 GitHub에 저장해야
      # 다음 실행에서 읽을 수 있다.
      # ========================================================

      - name: 💾 Persist AM Context

        if: |
          steps.mode.outputs.mode == 'am' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add -f \
            03_RESULTS/daily/AM_MARKET_CONTEXT_*.json \
            2>/dev/null || true


          git add -f \
            03_RESULTS/daily/AM_MARKET_CONTEXT_*.txt \
            2>/dev/null || true


          if git diff --cached --quiet; then

            echo "ℹ️ AM 결과 변경사항 없음"

          else

            git commit \
              -m "data: save AM market context"

            git push origin HEAD:main

          fi


      # ========================================================
      # 9. VERIFY AM CONTEXT
      #
      # OPTION SEARCH 전에 반드시
      # 오늘 AM JSON 존재 확인
      # ========================================================

      - name: 🔎 Verify AM Context

        if: |
          steps.mode.outputs.mode == 'option' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          python - <<'PY'

          import json

          from pathlib import Path

          from datetime import datetime

          from zoneinfo import ZoneInfo


          date = datetime.now(
              ZoneInfo(
                  "America/New_York"
              )
          ).strftime(
              "%Y%m%d"
          )


          path = (
              Path(
                  "03_RESULTS/daily"
              )
              /
              f"AM_MARKET_CONTEXT_{date}.json"
          )


          print(
              f"Expected AM Context: {path}"
          )


          if not path.exists():

              raise SystemExit(

                  "❌ 오늘 AM Context JSON이 없습니다.\n"

                  "AM 실행/저장이 먼저 성공해야 합니다."

              )


          with path.open(
              "r",
              encoding="utf-8"
          ) as f:

              payload = json.load(f)


          context = payload.get(
              "market_context",
              {}
          )


          print(
              "✅ AM Context found"
          )


          print(
              f"Direction: "
              f"{context.get('direction')}"
          )


          print(
              f"Score: "
              f"{context.get('score')}"
          )


          print(
              f"Regime: "
              f"{context.get('regime')}"
          )

          PY


      # ========================================================
      # 10. OPTION SEARCH
      #
      # 🇺🇸 08:30 ET
      #
      # 또는
      #
      # 🇺🇸 16:00 ET
      #
      # AM Context
      #      ↓
      # OPTION SEARCH
      #      ↓
      # OI DELTA
      #      ↓
      # FINAL TRADING LIST
      # ========================================================

      - name: 🔥 Portfolio Option Scanner V2

        if: |
          steps.mode.outputs.mode == 'option' ||
          steps.mode.outputs.mode == 'full'

        env:

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID:
            ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          set -e


          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🔥 PORTFOLIO OPTION SCANNER V2"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          echo "🌅 AM Context → OPTION SEARCH"

          echo "📊 OI DELTA"

          echo "🎯 FINAL TRADING LIST"


          echo ""


          python \
            portfolio_option_scanner_v2.py


      # ========================================================
      # 11. FINAL TRADING LIST 확인
      # ========================================================

      - name: 🎯 Verify Final Trading List

        if: |
          steps.mode.outputs.mode == 'option' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          FILE="03_RESULTS/daily/OPTION_FINAL_RANKING.csv"


          if [
            ! -f "$FILE"
          ]; then

            echo \
              "❌ FINAL RANKING 없음: $FILE"

            exit 1

          fi


          echo \
            "✅ FINAL RANKING FOUND"


          echo ""


          head -30 "$FILE"


      # ========================================================
      # 12. OPTION / OI / SIGNAL 결과 저장
      # ========================================================

      - name: 💾 Persist Option Results

        if: |
          steps.mode.outputs.mode == 'option' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add -f \
            03_RESULTS \
            2>/dev/null || true


          if git diff --cached --quiet; then

            echo \
              "ℹ️ 옵션 결과 변경사항 없음"

          else

            git commit \
              -m "data: save option scanner results"

            git push origin HEAD:main

          fi


      # ========================================================
      # 13. PM VOLATILITY UPDATE
      #
      # 🇺🇸 16:05 ET
      # ========================================================

      - name: 🌙 PM Volatility Update

        if: |
          steps.mode.outputs.mode == 'pm' ||
          steps.mode.outputs.mode == 'full'

        env:

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID:
            ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          set -e


          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🌙 PM VOLATILITY UPDATE"

          echo "🇺🇸 16:05 ET"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          python \
            01_MARKET_CONTEXT/pm_volatility_update.py


      # ========================================================
      # 14. SIGNAL PERFORMANCE
      # ========================================================

      - name: 🧠 Signal Performance

        if: |
          steps.mode.outputs.mode == 'pm' ||
          steps.mode.outputs.mode == 'full'

        env:

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID:
            ${{ secrets.TELEGRAM_CHAT_ID }}

          PYTHONPATH:
            ${{ github.workspace }}

        run: |

          set -e


          if [
            -f "signal_performance.py"
          ]; then

            python - <<'PY'

            from signal_performance import (
                build_performance_message
            )


            print(
                build_performance_message(
                    limit=30
                )
            )

            PY

          else

            echo \
              "⚠️ signal_performance.py 없음"

          fi


      # ========================================================
      # 15. PM / PERFORMANCE 저장
      # ========================================================

      - name: 💾 Persist PM Results

        if: |
          steps.mode.outputs.mode == 'pm' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add -f \
            03_RESULTS \
            2>/dev/null || true


          if git diff --cached --quiet; then

            echo \
              "ℹ️ PM 결과 변경사항 없음"

          else

            git commit \
              -m \
              "data: save PM volatility and signal results"

            git push origin HEAD:main

          fi


      # ========================================================
      # 16. RESULT FILES
      # ========================================================

      - name: 📂 Show result files

        if: always()

        run: |

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "📂 RESULT FILES"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          find \
            03_RESULTS \
            -maxdepth 3 \
            -type f \
            -print \
            2>/dev/null \
            | sort || true


      # ========================================================
      # 17. ARTIFACT BACKUP
      # ========================================================

      - name: Upload results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name:
            portfolio-option-scanner-v2-${{ github.run_id }}

          path: |

            03_RESULTS/daily/*.csv

            03_RESULTS/daily/*.json

            03_RESULTS/daily/*.txt

            03_RESULTS/history/*.csv

          if-no-files-found: warn

          retention-days: 14


      # ========================================================
      # 18. COMPLETE
      # ========================================================

      - name: 🏁 Complete

        if: always()

        run: |

          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🏁 PORTFOLIO OPTION SCANNER V2"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          echo ""

          echo "Mode:"
          echo "${{ steps.mode.outputs.mode }}"


          echo ""

          echo "🌅 AM MARKET CONTEXT"

          echo "      ↓"

          echo "🔥 OPTION SEARCH"

          echo "      ↓"

          echo "📊 OI DELTA"

          echo "      ↓"

          echo "🎯 FINAL TRADING LIST"

          echo "      ↓"

          echo "🌙 PM VOLATILITY UPDATE"

          echo "      ↓"

          echo "🧠 SIGNAL PERFORMANCE"


          echo ""

          echo "✅ WORKFLOW FINISHED"
