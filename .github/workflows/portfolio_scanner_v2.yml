
name: PORTFOLIO OPTION SCANNER V2

on:

  workflow_dispatch:

    inputs:

      mode:

        description: "실행 모드"

        required: true

        default: auto

        type: choice

        options:
          - auto
          - am
          - option
          - pm
          - full


  # ==========================================================
  # GitHub cron은 UTC 기준
  #
  # EDT
  # 08:00 ET = 12:00 UTC
  # 08:30 ET = 12:30 UTC
  # 16:00 ET = 20:00 UTC
  # 16:05 ET = 20:05 UTC
  #
  # EST
  # 08:00 ET = 13:00 UTC
  # 08:30 ET = 13:30 UTC
  # 16:00 ET = 21:00 UTC
  # 16:05 ET = 21:05 UTC
  #
  # 두 세트를 모두 등록한다.
  # 실제 New York 시간을 확인하여
  # 올바른 단계만 실행한다.
  # ==========================================================

  schedule:

    - cron: "0 12 * * 1-5"
    - cron: "0 13 * * 1-5"

    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"

    - cron: "0 20 * * 1-5"
    - cron: "0 21 * * 1-5"

    - cron: "5 20 * * 1-5"
    - cron: "5 21 * * 1-5"


permissions:

  contents: write


concurrency:

  group: portfolio-option-scanner-v2-main

  cancel-in-progress: false


jobs:

  portfolio-scanner-v2:

    runs-on: ubuntu-latest

    steps:


      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          ref: main


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ======================================================
      # 3. DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            yfinance


      # ======================================================
      # 4. ENVIRONMENT
      # ======================================================

      - name: Configure Python path

        run: |

          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"


      # ======================================================
      # 5. DETERMINE RUN MODE
      #
      # 수동:
      #   am
      #   option
      #   pm
      #   full
      #
      # auto:
      #   현재 New York 시간으로 판단
      #
      # schedule:
      #   cron이 약간 늦어져도 실제 ET 기준으로 판단
      # ======================================================

      - name: Determine execution mode

        id: mode

        env:

          MANUAL_MODE: ${{ github.event.inputs.mode }}

          SCHEDULE_CRON: ${{ github.event.schedule }}

        run: |

          python - <<'PY'

          import os

          from datetime import datetime

          from zoneinfo import ZoneInfo


          ET = ZoneInfo(
              "America/New_York"
          )


          now = datetime.now(
              ET
          )


          manual = os.environ.get(
              "MANUAL_MODE",
              ""
          ).strip().lower()


          schedule = os.environ.get(
              "SCHEDULE_CRON",
              ""
          ).strip()


          hour = now.hour

          minute = now.minute

          total_minutes = (
              hour * 60
              + minute
          )


          print(
              "=========================================="
          )

          print(
              "🇺🇸 US EASTERN TIME"
          )

          print(
              now.strftime(
                  "%Y-%m-%d %H:%M:%S %Z"
              )
          )

          print(
              "=========================================="
          )

          print(
              f"Manual mode : {manual or 'none'}"
          )

          print(
              f"Schedule    : {schedule or 'manual'}"
          )


          # ==================================================
          # MANUAL MODE
          # ==================================================

          if manual and manual != "auto":

              mode = manual

              print(
                  f"📌 MANUAL RUN → {mode.upper()}"
              )


          else:

              mode = "none"


              # =================================================
              # 08:00 ET → AM
              # =================================================

              if (
                  7 * 60 + 45
                  <= total_minutes
                  <= 8 * 60 + 15
              ):

                  mode = "am"


              # =================================================
              # 08:30 ET → OPTION
              # =================================================

              elif (
                  8 * 60 + 15
                  <= total_minutes
                  <= 8 * 60 + 50
              ):

                  mode = "option"


              # =================================================
              # 16:00 ET → OPTION
              # =================================================

              elif (
                  15 * 60 + 45
                  <= total_minutes
                  <= 16 * 60 + 15
              ):

                  mode = "option"


              # =================================================
              # 16:05 ET → PM
              # =================================================

              elif (
                  16 * 60
                  <= total_minutes
                  <= 16 * 60 + 25
              ):

                  mode = "pm"


              print(
                  f"🕐 AUTO TIME CHECK → "
                  f"{now.strftime('%H:%M:%S %Z')}"
              )

              print(
                  f"📌 AUTO RUN MODE → {mode.upper()}"
              )


          # ==================================================
          # MARKET DATE
          # ==================================================

          market_date = now.strftime(
              "%Y%m%d"
          )


          # ==================================================
          # GITHUB OUTPUT
          # ==================================================

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:

              f.write(
                  f"mode={mode}\n"
              )

              f.write(
                  f"market_date={market_date}\n"
              )


          print(
              "=========================================="
          )

          print(
              f"RUN_MODE: {mode}"
          )

          print(
              f"MARKET_DATE: {market_date}"
          )

          print(
              "=========================================="

          )

          PY


      # ======================================================
      # 6. PREPARE RESULT DIRECTORIES
      #
      # 03_RESULTS가 Git에 없어도
      # 실행 전에 자동 생성한다.
      # ======================================================

      - name: 📁 Prepare result directories

        run: |

          set -e

          mkdir -p 03_RESULTS/daily

          mkdir -p 03_RESULTS/history

          echo "=========================================="

          echo "📁 RESULT DIRECTORIES"

          echo "=========================================="

          find 03_RESULTS \
            -maxdepth 2 \
            -type d \
            -print \
            | sort


      # ======================================================
      # 7. COMPILE CHECK
      # ======================================================

      - name: Compile Python files

        run: |

          set -e

          python -m py_compile \
            01_MARKET_CONTEXT/am_market_context.py \
            01_MARKET_CONTEXT/pm_volatility_update.py \
            option_search.py \
            batch_option_search.py \
            oi_history.py \
            signal_history.py \
            signal_performance.py \
            portfolio_option_scanner_v2.py

          echo "✅ Python compile check passed"


      # ======================================================
      # 8. AM MARKET CONTEXT
      #
      # 08:00 ET
      # ======================================================

      - name: 🌅 AM Market Context

        if: |
          steps.mode.outputs.mode == 'am' ||
          steps.mode.outputs.mode == 'full'

        env:

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID:
            ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          set -e

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🌅 AM MARKET CONTEXT"

          echo "🇺🇸 08:00 ET"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          python \
            01_MARKET_CONTEXT/am_market_context.py


          echo ""

          echo "📂 AM RESULT"

          find \
            03_RESULTS/daily \
            -maxdepth 1 \
            -type f \
            -name "AM_MARKET_CONTEXT_*" \
            -print \
            | sort || true


      # ======================================================
      # 9. VERIFY AM RESULT
      # ======================================================

      - name: 🔎 Verify AM Result

        if: |
          steps.mode.outputs.mode == 'am' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e

          DATE="${{ steps.mode.outputs.market_date }}"

          JSON_FILE="03_RESULTS/daily/AM_MARKET_CONTEXT_${DATE}.json"


          echo "Expected:"
          echo "$JSON_FILE"


          if [ ! -f "$JSON_FILE" ]; then

            echo "❌ AM Context JSON 없음"

            echo ""

            echo "📂 현재 daily 파일:"

            find \
              03_RESULTS/daily \
              -maxdepth 1 \
              -type f \
              -print \
              | sort || true

            exit 1

          fi


          echo "✅ AM Context found"

          ls -lh "$JSON_FILE"


      # ======================================================
      # 10. PERSIST AM CONTEXT
      #
      # 매우 중요:
      #
      # AM 실행과 OPTION 실행은 서로 다른
      # GitHub Actions 실행이다.
      #
      # 따라서 AM JSON을 main에 저장한다.
      # ======================================================

      - name: 💾 Persist AM Context

        if: |
          steps.mode.outputs.mode == 'am' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add -f \
            03_RESULTS \
            2>/dev/null || true


          if git diff --cached --quiet; then

            echo "ℹ️ AM 결과 변경사항 없음"

          else

            git commit \
              -m "data: save AM market context"

            git push origin HEAD:main

          fi


      # ======================================================
      # 11. VERIFY AM BEFORE OPTION
      #
      # 08:30 OPTION 실행 전에
      # 오늘 AM JSON이 반드시 존재해야 한다.
      # ======================================================

      - name: 🔎 Verify AM Context Before Option

        if: |
          steps.mode.outputs.mode == 'option' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          DATE="${{ steps.mode.outputs.market_date }}"

          FILE="03_RESULTS/daily/AM_MARKET_CONTEXT_${DATE}.json"


          echo "Expected AM Context:"
          echo "$FILE"


          if [ ! -f "$FILE" ]; then

            echo ""

            echo "❌ 오늘 AM Context가 없습니다."

            echo ""

            echo "현재 파일:"

            find \
              03_RESULTS \
              -maxdepth 3 \
              -type f \
              -print \
              | sort || true

            exit 1

          fi


          echo "✅ AM Context found"


      # ======================================================
      # 12. OPTION SEARCH
      #
      # AM Context
      #      ↓
      # OPTION SEARCH
      #      ↓
      # OI DELTA
      #      ↓
      # FINAL TRADING LIST
      #
      # 08:30 ET
      # 또는
      # 16:00 ET
      # ======================================================

      - name: 🔥 Portfolio Option Scanner V2

        if: |
          steps.mode.outputs.mode == 'option' ||
          steps.mode.outputs.mode == 'full'

        env:

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID:
            ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          set -e


          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🔥 PORTFOLIO OPTION SCANNER V2"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          echo "🌅 AM Context → OPTION SEARCH"

          echo "📊 OI DELTA"

          echo "🎯 FINAL TRADING LIST"


          echo ""


          python \
            portfolio_option_scanner_v2.py


          echo ""

          echo "📂 OPTION RESULTS"


          find \
            03_RESULTS \
            -maxdepth 3 \
            -type f \
            -print \
            | sort || true


      # ======================================================
      # 13. VERIFY FINAL TRADING LIST
      # ======================================================

      - name: 🎯 Verify Final Trading List

        if: |
          steps.mode.outputs.mode == 'option' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          FILE="03_RESULTS/daily/OPTION_FINAL_RANKING.csv"


          if [ ! -f "$FILE" ]; then

            echo "❌ FINAL RANKING 없음"

            echo ""

            echo "현재 생성된 파일:"

            find \
              03_RESULTS \
              -maxdepth 3 \
              -type f \
              -print \
              | sort || true

            exit 1

          fi


          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "✅ FINAL RANKING FOUND"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          ls -lh "$FILE"


          echo ""

          echo "📊 TOP 30"

          head -30 "$FILE"


      # ======================================================
      # 14. PERSIST OPTION RESULTS
      # ======================================================

      - name: 💾 Persist Option Results

        if: |
          steps.mode.outputs.mode == 'option' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add -f \
            03_RESULTS \
            2>/dev/null || true


          if git diff --cached --quiet; then

            echo "ℹ️ 옵션 결과 변경사항 없음"

          else

            git commit \
              -m "data: save option scanner results"

            git push origin HEAD:main

          fi


      # ======================================================
      # 15. PM VOLATILITY UPDATE
      #
      # 16:05 ET
      # ======================================================

      - name: 🌙 PM Volatility Update

        if: |
          steps.mode.outputs.mode == 'pm' ||
          steps.mode.outputs.mode == 'full'

        env:

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID:
            ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          set -e


          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🌙 PM VOLATILITY UPDATE"

          echo "🇺🇸 16:05 ET"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          python \
            01_MARKET_CONTEXT/pm_volatility_update.py


      # ======================================================
      # 16. SIGNAL PERFORMANCE
      # ======================================================

      - name: 🧠 Signal Performance

        if: |
          steps.mode.outputs.mode == 'pm' ||
          steps.mode.outputs.mode == 'full'

        env:

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID:
            ${{ secrets.TELEGRAM_CHAT_ID }}

          PYTHONPATH:
            ${{ github.workspace }}

        run: |

          set -e


          if [ -f "signal_performance.py" ]; then

            python - <<'PY'

          from signal_performance import (
              build_performance_message
          )


          print(
              build_performance_message(
                  limit=30
              )
          )

          PY

          else

            echo "⚠️ signal_performance.py 없음"

          fi


      # ======================================================
      # 17. PERSIST PM RESULTS
      # ======================================================

      - name: 💾 Persist PM Results

        if: |
          steps.mode.outputs.mode == 'pm' ||
          steps.mode.outputs.mode == 'full'

        run: |

          set -e


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add -f \
            03_RESULTS \
            2>/dev/null || true


          if git diff --cached --quiet; then

            echo "ℹ️ PM 결과 변경사항 없음"

          else

            git commit \
              -m "data: save PM volatility and signal results"

            git push origin HEAD:main

          fi


      # ======================================================
      # 18. SHOW ALL RESULT FILES
      #
      # 항상 실행
      # ======================================================

      - name: 📂 Show result files

        if: always()

        run: |

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "📂 RESULT FILES"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          if [ -d "03_RESULTS" ]; then

            find \
              03_RESULTS \
              -maxdepth 3 \
              -type f \
              -print \
              | sort

          else

            echo "⚠️ 03_RESULTS 디렉터리 없음"

          fi


      # ======================================================
      # 19. ARTIFACT BACKUP
      #
      # 특정 csv/json/txt만 지정하지 않는다.
      #
      # 03_RESULTS 전체를 백업한다.
      # ======================================================

      - name: 📦 Upload results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name:
            portfolio-option-scanner-v2-${{ github.run_id }}

          path: |

            03_RESULTS/

          if-no-files-found: warn

          retention-days: 14


      # ======================================================
      # 20. COMPLETE
      # ======================================================

      - name: 🏁 Complete

        if: always()

        run: |

          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🏁 PORTFOLIO OPTION SCANNER V2"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━"


          echo ""

          echo "Mode:"
          echo "${{ steps.mode.outputs.mode }}"


          echo ""

          echo "Market Date:"
          echo "${{ steps.mode.outputs.market_date }}"


          echo ""

          echo "PIPELINE"

          echo ""

          echo "🌅 AM MARKET CONTEXT"

          echo "      ↓"

          echo "🔥 OPTION SEARCH"

          echo "      ↓"

          echo "📊 OI DELTA"

          echo "      ↓"

          echo "🎯 FINAL TRADING LIST"

          echo "      ↓"

          echo "🌙 PM VOLATILITY UPDATE"

          echo "      ↓"

          echo "🧠 SIGNAL PERFORMANCE"


          echo ""

          echo "📂 FINAL RESULT FILES"


          if [ -d "03_RESULTS" ]; then

            find \
              03_RESULTS \
              -maxdepth 3 \
              -type f \
              -print \
              | sort

          fi


          echo ""

          echo "✅ WORKFLOW FINISHED"

