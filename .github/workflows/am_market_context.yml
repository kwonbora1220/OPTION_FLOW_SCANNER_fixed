name: AM Market Context

on:
  workflow_dispatch:

  schedule:
    # 08:00 ET during EDT (UTC-4)
    - cron: "0 12 * * 1-5"

    # 08:00 ET during EST (UTC-5)
    - cron: "0 13 * * 1-5"

jobs:
  am-market-context:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Check US Eastern Time
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))

          print("US Eastern Time:", now)
          print("Hour:", now.hour)
          print("Minute:", now.minute)
          print("Weekday:", now.weekday())

          if not (
              now.weekday() < 5
              and now.hour == 8
          ):
              print("⚠️ This workflow was triggered outside AM target time.")
              print("The analysis will still run.")
          else:
              print("✅ AM target time confirmed.")
          PY

      - name: Run AM Market Context
        run: |
          python 01_MARKET_CONTEXT/am_market_context.py

      - name: Send AM Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          from pathlib import Path

          result_dir = Path(
              "03_RESULTS/daily"
          )

          files = sorted(
              result_dir.glob(
                  "AM_MARKET_CONTEXT_*.txt"
              ),
              key=lambda x: x.stat().st_mtime,
              reverse=True
          )

          if not files:
              raise FileNotFoundError(
                  "AM_MARKET_CONTEXT_*.txt 파일을 찾을 수 없습니다."
              )

          path = files[0]

          print(
              f"📄 Telegram 전송 파일: {path}"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          if not text.strip():
              raise RuntimeError(
                  "AM 결과 파일이 비어 있습니다."
              )

          token = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          chat_id = os.environ[
              "TELEGRAM_CHAT_ID"
          ]

          url = (
              f"https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )

          response = requests.post(
              url,
              json={
                  "chat_id": chat_id,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
              },
              timeout=30,
          )

          print(
              "Telegram status:",
              response.status_code
          )

          print(
              response.text
          )

          response.raise_for_status()

          print(
              "✅ AM Telegram sent successfully"
          )
          PY
        
